# Render Blueprint: free web service, no disk. Alerts live in visitors' browsers; the catalog cache is rebuilt after a restart.
services:
  - type: web
    name: heritagesale
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 --timeout 120 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /privacy
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKGROUND
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: CACHE_DIR
        value: /tmp/cache
      - key: CONTACT_EMAIL
        sync: false
